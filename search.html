<body>

</header>
<main id="main">

<header class="masthead">
<h1>Search</h1>
<p class="sub">Full-text search across every collected item, straight from your browser.</p>
</header>

<div class="search-box">
<label class="visually-hidden" for="searchInput">Search items</label>
<input type="text" id="searchInput" placeholder="Search titles, summaries, tags and sources" oninput="doSearch(this.value)" autocomplete="off">
</div>

<p class="empty" id="searchHint">Type at least two characters to search the archive.</p>
<div class="entries" id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" integrity="sha384-PCSoOZTpbkikBEtd/+uV3WNdc676i9KUf01KOA8CnJotvlx8rRrETbDuwdjqTYvt" crossorigin="anonymous"></script>
<script>
let fuse = null;
let allItems = [];

function esc(s) {
return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function safeUrl(u) {
try {
const x = new URL(u, location.href);
return (x.protocol === 'http:' || x.protocol === 'https:') ? u : '#';
} catch(e) { return '#'; }
}

function setResults(html) {
document.getElementById('results').innerHTML = html;
}

async function loadItems() {
try {
const resp = await fetch('day/items.json');
if (!resp.ok) throw new Error('Not found');
allItems = await resp.json();
fuse = new Fuse(allItems, { keys: ['title', 'summary', 'tags', 'source_name'], threshold: 0.4 });
document.getElementById('searchHint').textContent = 'Type at least two characters to search ' + allItems.length + ' items.';
} catch(e) {
document.getElementById('searchHint').className = 'empty empty--error';
document.getElementById('searchHint').textContent = 'The search index could not be loaded. Reload the page, or browse the archive instead.';
}
}

function doSearch(q) {
const hint = document.getElementById('searchHint');
if (!q || !fuse) {
setResults('');
hint.hidden = false;
return;
}
const results = fuse.search(q).slice(0, 50);
if (!results.length) {
setResults('<p class="empty">No item matches “' + esc(q) + '”. Try a shorter word or a source name.</p>');
hint.hidden = true;
return;
}
hint.hidden = true;
setResults(results.map(r => `
<article class="entry">
<h3 class="entry-title"><a href="${esc(safeUrl(r.item.url))}" target="_blank" rel="noopener">${esc(r.item.title)}</a></h3>
<p class="entry-meta"><span class="chip">${esc(r.item.source_name || '')}</span><span>${esc(r.item.date)}</span></p>
${r.item.summary ? `<p class="entry-summary">${esc(r.item.summary.slice(0,300))}</p>` : ''}
</article>`).join(''));
}

loadItems();
</script>

</main>
