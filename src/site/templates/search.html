{% extends "base.html" %}
{% block title %}Search FinOps{% endblock %}
{% block content %}
<div class="hero" style="padding:2rem 0 1.5rem;">
<h1 style="font-size:clamp(1.8rem,3vw,2.5rem)">Search</h1>
<p>Search across all collected FinOps intelligence</p>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search titles, summaries, tags..." oninput="doSearch(this.value)">
</div>
<div id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" integrity="sha384-PCSoOZTpbkikBEtd/+uV3WNdc676i9KUf01KOA8CnJotvlx8rRrETbDuwdjqTYvt" crossorigin="anonymous"></script>
<script>
let fuse = null;
let allItems = [];

function esc(s) {
return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function safeUrl(u) {
try {
const x = new URL(u, location.href);
return (x.protocol === 'http:' || x.protocol === 'https:') ? u : '#';
} catch(e) { return '#'; }
}

async function loadItems() {
try {
const resp = await fetch('{{ root_path }}day/items.json');
if (!resp.ok) throw new Error('Not found');
allItems = await resp.json();
fuse = new Fuse(allItems, { keys: ['title', 'summary', 'tags', 'source_name'], threshold: 0.4 });
} catch(e) {
document.getElementById('results').innerHTML = '<p style="text-align:center;color:#64748b;padding:2rem;">Search index not available in static mode.</p>';
}
}

function doSearch(q) {
const el = document.getElementById('results');
if (!q || !fuse) { el.innerHTML = ''; return; }
const results = fuse.search(q).slice(0, 50);
el.innerHTML = results.map(r => `
<div class="card">
<h3><a href="${esc(safeUrl(r.item.url))}" target="_blank" rel="noopener">${esc(r.item.title)}</a></h3>
<div class="meta">${esc(r.item.date)} · ${esc(r.item.source_name || r.item.source_id || '')}</div>
${r.item.summary ? `<div class="summary">${esc(r.item.summary.slice(0,300))}</div>` : ''}
</div>
`).join('');
}

loadItems();
</script>
{% endblock %}
